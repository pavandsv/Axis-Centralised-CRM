[build]
  command = "npm run build"
  publish = "dist"

# Deep links (/dashboard, /leads) must fall through to the SPA shell.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
